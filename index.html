<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mobily Site Acceptance Portal</title>
<style>
:root{--blue:#4A90D9;--dk:#0B2E59;--mid:#2B6CB0;--green:#00B140;--red:#E74C3C;--amber:#F5A623;--bg:#f0f5fa;--card:#fff;--border:#dce6f0;--sub:#6B8199;--text:#0B2E59}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:var(--bg);color:var(--text)}
.hdr{background:linear-gradient(135deg,var(--dk),var(--mid),var(--blue));padding:16px 24px;color:#fff;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.hdr h1{font-size:18px;font-weight:800}
.hdr small{display:block;font-size:10px;color:#b8d4f0;margin-top:2px}
.tabs{background:var(--card);border-bottom:1px solid var(--border);display:flex;overflow-x:auto;padding:0 16px}
.tab{padding:12px 18px;border:none;background:none;cursor:pointer;font-weight:500;color:var(--sub);font-size:13px;border-bottom:3px solid transparent;white-space:nowrap;font-family:inherit}
.tab.active{color:var(--mid);font-weight:700;border-bottom-color:var(--blue)}
.content{padding:16px 20px;max-width:1200px;margin:0 auto}
.hero{background:linear-gradient(135deg,var(--dk),var(--mid));border-radius:16px;padding:24px;margin-bottom:16px;color:#fff}
.kpi-grid{display:flex;gap:8px;flex-wrap:wrap}
.kpi{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:14px 16px;cursor:pointer;min-width:100px;flex:1 1 100px;transition:background .2s}
.kpi:hover{background:rgba(255,255,255,.15)}
.kpi .v{font-size:26px;font-weight:800;line-height:1}
.kpi .l{font-size:9px;font-weight:700;color:#b8d4f0;letter-spacing:.6px;text-transform:uppercase;margin-top:4px}
.kpi .s{font-size:10px;color:#b8d4f0;margin-top:2px}
.pbar{margin-top:14px;height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden}
.pbar-fill{height:100%;background:linear-gradient(90deg,#00B140,#4ade80);border-radius:4px}
.card{background:var(--card);border-radius:14px;border:1px solid var(--border);margin-bottom:12px;overflow:hidden}
.card-hdr{padding:14px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.card-hdr h3{font-size:14px;flex:1}
.card-body{padding:14px 18px}
.mc-grid{display:flex;gap:8px;flex-wrap:wrap}
.mc{padding:8px 14px;border-radius:10px;cursor:pointer;min-width:75px;transition:box-shadow .15s}
.mc:hover{box-shadow:0 4px 16px rgba(0,0,0,.1)}
.mc .v{font-size:20px;font-weight:800;line-height:1}
.mc .l{font-size:9px;font-weight:700;color:var(--sub);letter-spacing:.5px;text-transform:uppercase;margin-top:3px}
.mc .s2{font-size:9px;color:var(--sub);margin-top:1px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700;white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.b-acc{background:#e6f9ed;color:#0a7c2e}.b-acc .dot{background:#00B140}
.b-sub{background:#e8f4fd;color:#1a5276}.b-sub .dot{background:#2E86C1}
.b-uit{background:#fef9c3;color:#854d0e}.b-uit .dot{background:#ca8a04}
.b-iss{background:#fde8e6;color:#922b21}.b-iss .dot{background:#E74C3C}
.b-nf{background:#f3f4f6;color:#64748b}.b-nf .dot{background:#9ca3af}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl thead tr{background:linear-gradient(90deg,var(--dk),var(--mid))}
.tbl th{padding:10px 12px;text-align:left;font-weight:700;font-size:10px;color:#b8d4f0;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--border)}
.tbl tr:nth-child(even){background:#f7fafd}
.tbl tr:hover{background:#ebf4ff}
.sid{font-weight:700;color:var(--mid);font-family:monospace;font-size:12px}
.pg{display:flex;gap:8px;justify-content:center;padding:10px;border-top:1px solid var(--border)}
.pg button{padding:4px 14px;border-radius:6px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:12px;color:var(--mid);font-weight:600}
.pg button:disabled{opacity:.4;cursor:default}
.pg span{font-size:12px;color:var(--sub);align-self:center}
.acc-hdr{padding:12px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px}
.own-hdr{padding:6px 18px;background:#fffbeb;border-left:4px solid var(--amber);display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:#92400e}
.sep{border-top:1px solid var(--border);margin-top:8px;padding-top:8px}
.modal-bg{position:fixed;inset:0;background:rgba(11,46,89,.6);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal{background:#fff;border-radius:20px;width:100%;max-width:1100px;box-shadow:0 24px 80px rgba(11,46,89,.4);overflow:hidden}
.modal-hdr{padding:14px 24px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,var(--dk),var(--blue));color:#fff}
.modal-hdr h4{font-size:15px}
.modal-hdr button{background:rgba(255,255,255,.15);border:none;color:#fff;cursor:pointer;font-size:20px;border-radius:10px;padding:2px 12px;font-weight:700}
.tech{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700}
.t4g-ok{background:#dbeafe;color:#1e40af;border:1px solid #93c5fd}
.t4g-bad{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
.t5g-ok{background:#ede9fe;color:#5b21b6;border:1px solid #c4b5fd}
.t5g-bad{background:#fef3c7;color:#92400e;border:1px solid #fcd34d}
.chart-wrap{display:flex;align-items:flex-end;gap:2px;height:130px;overflow-x:auto;padding-bottom:4px}
.chart-col{display:flex;flex-direction:column;align-items:center;min-width:28px;gap:1px}
.bar{width:22px;border-radius:2px 2px 0 0;cursor:pointer;min-height:1px}
.bar:hover{opacity:.8}
.lbl{font-size:8px;color:var(--sub);margin-top:3px;text-align:center;white-space:nowrap}
.chart-legend{display:flex;gap:12px;margin-top:8px;font-size:11px;flex-wrap:wrap}
.chart-legend .item{display:flex;align-items:center;gap:4px}
.chart-legend .swatch{width:10px;height:10px;border-radius:2px}
.search-box{padding:8px 16px;border-radius:99px;border:1px solid var(--border);font-size:13px;width:100%;outline:none;margin-bottom:12px;font-family:inherit}
.lookup-ta{width:100%;padding:10px 14px;border-radius:10px;border:1px solid var(--border);font-size:13px;outline:none;resize:vertical;font-family:inherit;background:#f7fafd;margin-bottom:10px}
.btn{padding:8px 20px;border-radius:10px;font-weight:700;cursor:pointer;border:none;font-size:13px;font-family:inherit}
.footer{text-align:center;padding:14px;border-top:1px solid var(--border);background:var(--card);margin-top:16px;font-size:10px;color:var(--sub)}
.cat-cards{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.cat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;flex:1;min-width:140px;padding:16px;text-align:center;cursor:pointer;transition:box-shadow .15s}
.cat-card:hover{box-shadow:0 4px 16px rgba(11,46,89,.1)}
</style>
</head>
<body>
<div id="app"></div>
<script>
var D = {"ibs":[],"rel":[],"hw":[],"sw":[]};
var ST = {tab:"overview", drill:null, lookupResult:null};

function esc(v){return (v===null||v===undefined||v===false)?"&mdash;":(String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;") || "&mdash;");}
function agC(d){if(d==null)return"#bbb";if(d>60)return"#E74C3C";if(d>30)return"#F5A623";if(d>14)return"#ca8a04";return"#00B140";}
function badge(s){var m={Accepted:"b-acc",Submitted:"b-sub","Under IT":"b-uit",Issue:"b-iss","Not Found":"b-nf"};return'<span class="badge '+(m[s]||"b-sub")+'"><span class="dot"></span>'+esc(s)+'</span>';}
function t4g(s){var ok=s==="Accepted"||s==="Not Required";return'<span class="tech '+(ok?"t4g-ok":"t4g-bad")+'">4G '+esc(s)+'</span>';}
function t5g(s){var ok=s==="Accepted"||s==="No 5G"||s==="N/A";return'<span class="tech '+(ok?"t5g-ok":"t5g-bad")+'">5G '+esc(s)+'</span>';}
function agT(d){if(d==null)return'<span style="color:#ddd">&mdash;</span>';return'<span style="color:'+agC(d)+';font-weight:700">'+d+'d</span>';}

function all(){return[].concat(D.ibs||[],D.rel||[],D.hw||[],D.sw||[]);}
function siteMap(){var m={};all().forEach(function(r){if(!m[r.sid])m[r.sid]=[];m[r.sid].push(r);});return m;}

var PAGE_SIZE=50;
var tablePages={};

function buildTable(rows,type,tkey){
  if(!rows||!rows.length)return'<p style="padding:20px;text-align:center;color:#94a3b8">No records</p>';
  var isHW=type==="hw",isSW=type==="sw",isLK=type==="lookup";
  var cols=isLK?["Site ID","Category","Sub-Cat","Status","4G","5G","IT Feedback","Owner","Issues","RFIT","Aging","Accepted","Reason"]
    :isHW?["Site ID","Status","4G","5G","Type","Activity","RFIT","Aging","Accepted","Owner","Reason"]
    :isSW?["Site ID","Status","5G","Activity","RFIT","Aging","Accepted","Owner","Reason"]
    :["Site ID","Project","Status","IT Feedback","5G","RFIT","Aging","Accepted","Owner","Reason"];
  var pg=tablePages[tkey]||0;
  var start=pg*PAGE_SIZE,end=Math.min(start+PAGE_SIZE,rows.length);
  var vis=rows.slice(start,end);
  var h='<table class="tbl"><thead><tr>'+cols.map(function(c){return'<th>'+c+'</th>';}).join("")+'</tr></thead><tbody>';
  vis.forEach(function(r){
    if(!r)return;
    h+='<tr>';
    if(isLK){h+='<td class="sid">W'+esc(r.sid)+'</td><td>'+esc(r.cat)+'</td><td>'+esc(r.subcat)+'</td><td>'+badge(r.finalStatus)+'</td><td>'+t4g(r.fg4)+'</td><td>'+t5g(r.fg5)+'</td><td>'+esc(r.itfb)+'</td><td>'+esc(r.ao)+'</td><td>'+esc(r.an)+'</td><td>'+esc(r.rfit)+'</td><td>'+agT(r.aging)+'</td><td>'+esc(r.accDate)+'</td><td>'+esc(r.pendingReason)+'</td>';}
    else if(isHW){h+='<td class="sid">W'+esc(r.sid)+'</td><td>'+badge(r.finalStatus)+'</td><td>'+t4g(r.fg4)+'</td><td>'+t5g(r.fg5)+'</td><td>'+esc(r.activityType)+'</td><td>'+esc(r.activity)+'</td><td>'+esc(r.rfit)+'</td><td>'+agT(r.aging)+'</td><td>'+esc(r.accDate)+'</td><td>'+esc(r.ao)+'</td><td>'+esc(r.pendingReason)+'</td>';}
    else if(isSW){h+='<td class="sid">W'+esc(r.sid)+'</td><td>'+badge(r.finalStatus)+'</td><td>'+t5g(r.fg5)+'</td><td>'+esc(r.activity)+'</td><td>'+esc(r.rfit)+'</td><td>'+agT(r.aging)+'</td><td>'+esc(r.accDate)+'</td><td>'+esc(r.ao)+'</td><td>'+esc(r.pendingReason)+'</td>';}
    else{h+='<td class="sid">W'+esc(r.sid)+'</td><td>'+esc(r.subcat)+'</td><td>'+badge(r.finalStatus)+'</td><td>'+esc(r.itfb)+'</td><td>'+t5g(r.fg5)+'</td><td>'+esc(r.rfit)+'</td><td>'+agT(r.aging)+'</td><td>'+esc(r.accDate)+'</td><td>'+esc(r.ao)+'</td><td>'+esc(r.pendingReason)+'</td>';}
    h+='</tr>';
  });
  h+='</tbody></table>';
  var pages=Math.ceil(rows.length/PAGE_SIZE);
  if(pages>1){
    h+='<div class="pg"><button onclick="tp(''+tkey+'','+(pg-1)+')" '+(pg===0?'disabled':'')+'>Prev</button>';
    h+='<span>'+(pg+1)+'/'+pages+' ('+rows.length+' records)</span>';
    h+='<button onclick="tp(''+tkey+'','+(pg+1)+')" '+(pg>=pages-1?'disabled':'')+'>Next</button></div>';
  }
  return h;
}

function tp(k,p){tablePages[k]=p;render();}

function showDrill(t,rows,type){ST.drill={title:t,rows:rows,type:type};tablePages.drill=0;render();}
function closeDrill(){ST.drill=null;render();}

function mc(label,val,color,onclick,sub){
  return'<div class="mc" style="background:'+color+'11;border:1px solid '+color+'33" onclick="'+onclick+'"><div class="v" style="color:'+color+'">'+val.toLocaleString()+'</div><div class="l">'+label+'</div>'+(sub?'<div class="s2">'+sub+'</div>':'')+'</div>';
}

function catSection(title,icon,rows,type){
  var acc=rows.filter(function(r){return r.finalStatus==="Accepted";}).length;
  var pct=rows.length?Math.round(acc/rows.length*100):0;
  var iss=rows.filter(function(r){return r&&r.issue;});
  var pend=rows.filter(function(r){return r&&!r.issue&&r.finalStatus!=="Accepted";});
  var isHW=type==="hw";
  var tkey="cat_"+type;

  var h='<div class="card"><div class="card-hdr">'+icon+' <h3>'+title+'</h3>';
  h+='<div style="text-align:right"><div style="font-size:20px;font-weight:800;color:#00B140">'+pct+'%</div>';
  h+='<div style="height:6px;width:90px;background:#dce6f0;border-radius:3px;overflow:hidden;margin-top:2px"><div style="height:100%;width:'+pct+'%;background:#00B140;border-radius:3px"></div></div></div></div>';
  h+='<div class="card-body"><div class="mc-grid">';
  h+=mc("Total",rows.length,"#4A90D9","showDrill('All "+title+"',D."+(type==="ns_ibs"?"ibs":type==="ns_rel"?"rel":type)+",'"+type+"')");
  h+=mc("Accepted",acc,"#00B140","showDrill('Accepted',D."+(type==="ns_ibs"?"ibs":type==="ns_rel"?"rel":type)+".filter(function(r){return r.finalStatus==='Accepted'}),'"+type+"')");
  if(pend.length)h+=mc("Pending",pend.length,"#2E86C1","showDrill('Pending',D."+(type==="ns_ibs"?"ibs":type==="ns_rel"?"rel":type)+".filter(function(r){return r&&!r.issue&&r.finalStatus!=='Accepted'}),'"+type+"')");
  if(iss.length)h+=mc("Issues",iss.length,"#E74C3C","showDrill('Issues',D."+(type==="ns_ibs"?"ibs":type==="ns_rel"?"rel":type)+".filter(function(r){return r&&r.issue}),'"+type+"')");
  h+='</div>';

  if(isHW){
    var fg4o=rows.filter(function(r){return r.activityType==="4G Only";});
    var fg45=rows.filter(function(r){return r.activityType==="4G/5G";});
    var i4g=rows.filter(function(r){return r.is4gIssue;});
    var i5g=rows.filter(function(r){return r.is5gIssue;});
    var nUIT=rows.filter(function(r){return r.isUnderIT;});
    var nSub=rows.filter(function(r){return r.isSubmitted;});
    h+='<div class="sep"><div class="mc-grid">';
    h+=mc("4G Only",fg4o.length,"#2563eb","showDrill('4G Only',D.hw.filter(function(r){return r.activityType==\'4G Only\'}),'hw')","Acc: "+fg4o.filter(function(r){return r.finalStatus==="Accepted";}).length);
    h+=mc("4G/5G",fg45.length,"#7c3aed","showDrill('4G/5G',D.hw.filter(function(r){return r.activityType==\'4G/5G\'}),'hw')","Acc: "+fg45.filter(function(r){return r.finalStatus==="Accepted";}).length);
    if(i4g.length)h+=mc("4G Issues",i4g.length,"#E74C3C","showDrill('4G Issues',D.hw.filter(function(r){return r.is4gIssue}),'hw')");
    if(i5g.length)h+=mc("5G Issues",i5g.length,"#ea580c","showDrill('5G Issues',D.hw.filter(function(r){return r.is5gIssue}),'hw')");
    if(nUIT.length)h+=mc("Under IT",nUIT.length,"#ca8a04","showDrill('Under IT',D.hw.filter(function(r){return r.isUnderIT}),'hw')");
    if(nSub.length)h+=mc("Submitted",nSub.length,"#2E86C1","showDrill('Submitted',D.hw.filter(function(r){return r.isSubmitted}),'hw')");
    h+='</div></div>';
  }
  h+='</div>';

  if(iss.length){
    var byOwner={};
    iss.forEach(function(r){var o=r.ao||"Unknown";if(!byOwner[o])byOwner[o]=[];byOwner[o].push(r);});
    h+='<div class="acc-hdr" style="background:#fde8e6">&#9888; Issues by Action Owner ('+iss.length+')</div>';
    Object.keys(byOwner).forEach(function(o){
      h+='<div class="own-hdr">'+esc(o)+' <span style="font-weight:400;color:#6B8199">'+byOwner[o].length+' site(s)</span></div>';
      h+=buildTable(byOwner[o],type,tkey+"_iss_"+o);
    });
  }
  if(pend.length){
    h+='<div class="acc-hdr" style="background:#fef6e6">&#9203; Pending ('+pend.length+')</div>';
    h+=buildTable(pend,type,tkey+"_pend");
  }
  h+='<div class="acc-hdr" style="background:#e6f9ed">&#10003; Accepted ('+acc+')</div>';
  h+=buildTable(rows.filter(function(r){return r.finalStatus==="Accepted";}),type,tkey+"_acc");
  h+='</div>';
  return h;
}

function buildChart(rows){
  var months={};
  rows.forEach(function(r){
    if(!r||!r.rfitMonth)return;
    if(!months[r.rfitMonth])months[r.rfitMonth]={m:r.rfitMonth,a:0,s:0,p:0,t:0};
    months[r.rfitMonth].t++;
    if(r.finalStatus==="Accepted")months[r.rfitMonth].a++;
    else if(r.finalStatus==="Submitted")months[r.rfitMonth].s++;
    else months[r.rfitMonth].p++;
  });
  var sorted=Object.values(months).sort(function(a,b){return a.m.localeCompare(b.m);});
  if(!sorted.length)return'';
  var mx=Math.max.apply(null,sorted.map(function(d){return d.t;}));
  if(!mx)mx=1;
  var lbls=["","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var h='<div class="card"><div class="card-hdr"><h3>&#128202; Monthly RFIT &amp; Acceptance</h3></div><div class="card-body"><div class="chart-wrap">';
  sorted.forEach(function(d){
    var ha=Math.round(d.a/mx*120),hs=Math.round(d.s/mx*120),hp=Math.round(d.p/mx*120);
    var mo=d.m.split("-"); var lbl=lbls[parseInt(mo[1])]+"'"+mo[0].slice(2);
    h+='<div class="chart-col" title="'+lbl+': Acc='+d.a+' Sub='+d.s+' Pend='+d.p+'" onclick="showDrill(''+lbl+'',all().filter(function(r){return r.rfitMonth===''+d.m+'';}),'hw')">';
    if(hp)h+='<div class="bar" style="height:'+hp+'px;background:#F5A623"></div>';
    if(hs)h+='<div class="bar" style="height:'+hs+'px;background:#2E86C1"></div>';
    if(ha)h+='<div class="bar" style="height:'+ha+'px;background:#00B140"></div>';
    h+='<div class="lbl">'+lbl+'</div></div>';
  });
  h+='</div><div class="chart-legend"><div class="item"><div class="swatch" style="background:#00B140"></div>Accepted</div><div class="item"><div class="swatch" style="background:#2E86C1"></div>Submitted</div><div class="item"><div class="swatch" style="background:#F5A623"></div>Pending</div></div></div></div>';
  return h;
}

function render(){
  var a=all();
  var gs_acc=a.filter(function(r){return r&&r.finalStatus==="Accepted";}).length;
  var gs_sub=a.filter(function(r){return r&&r.finalStatus==="Submitted";}).length;
  var gs_uit=a.filter(function(r){return r&&r.finalStatus==="Under IT";}).length;
  var gs_i4=a.filter(function(r){return r&&r.is4gIssue;}).length;
  var gs_i5=a.filter(function(r){return r&&r.is5gIssue;}).length;
  var pct=a.length?Math.round(gs_acc/a.length*100):0;
  var dateStr="07 Jun 2026";

  var h='';
  h+='<div class="hdr"><div><h1>&#128225; Mobily Site Acceptance Portal</h1><small>Network Development Operations &middot; 3Y NW Expansion &middot; Data: '+dateStr+'</small></div>';
  h+='<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><div style="padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.1);color:#b8d4f0;font-size:11px;border:1px solid rgba(255,255,255,.15)">&#128197; '+dateStr+'</div>';
  h+='<div style="padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.08);color:#b8d4f0;font-size:10px;border:1px solid rgba(255,255,255,.12)">&#9135;&#9135;&#9135; ERICSSON</div></div></div>';

  var tabs=[{id:"overview",l:"Overview"},{id:"ns",l:"New Sites"},{id:"hw",l:"Expansion HW"},{id:"sw",l:"Expansion SW"},{id:"lookup",l:"Site Lookup"}];
  h+='<div class="tabs">';tabs.forEach(function(t){h+='<button class="tab'+(ST.tab===t.id?" active":"")+'" onclick="ST.tab=''+t.id+'';render()">'+t.l+'</button>';});h+='</div>';
  h+='<div class="content">';

  if(ST.tab==="overview"){
    h+='<div class="hero"><div style="font-size:11px;color:#b8d4f0;font-weight:600;letter-spacing:1px;margin-bottom:10px">EXECUTIVE SUMMARY</div>';
    h+='<div class="kpi-grid">';
    h+='<div class="kpi" onclick="showDrill('All Sites',all(),'hw')"><div class="v">'+a.length.toLocaleString()+'</div><div class="l">Total Sites</div></div>';
    h+='<div class="kpi" onclick="showDrill('Accepted',all().filter(function(r){return r.finalStatus==='Accepted';}),'hw')"><div class="v" style="color:#00B140">'+gs_acc.toLocaleString()+'</div><div class="l">Accepted</div><div class="s">'+pct+'%</div></div>';
    h+='<div class="kpi" onclick="showDrill('Submitted',all().filter(function(r){return r.finalStatus==='Submitted';}),'hw')"><div class="v" style="color:#2E86C1">'+gs_sub+'</div><div class="l">Submitted</div></div>';
    h+='<div class="kpi" onclick="showDrill('Under IT',all().filter(function(r){return r.finalStatus==='Under IT';}),'hw')"><div class="v" style="color:#F5A623">'+gs_uit+'</div><div class="l">Under IT</div></div>';
    h+='<div class="kpi" onclick="showDrill('4G Issues',all().filter(function(r){return r.is4gIssue;}),'hw')"><div class="v" style="color:#E74C3C">'+gs_i4+'</div><div class="l">4G Issues</div></div>';
    h+='<div class="kpi" onclick="showDrill('5G Issues',all().filter(function(r){return r.is5gIssue;}),'hw')"><div class="v" style="color:#ea580c">'+gs_i5+'</div><div class="l">5G Issues</div></div>';
    h+='</div><div class="pbar"><div class="pbar-fill" style="width:'+pct+'%"></div></div>';
    h+='<div style="margin-top:4px;font-size:11px;color:#b8d4f0">'+gs_acc.toLocaleString()+' accepted &middot; '+(a.length-gs_acc)+' remaining</div></div>';
    h+='<div class="cat-cards">';
    var ns_acc=(D.ibs||[]).concat(D.rel||[]).filter(function(r){return r.finalStatus==="Accepted";}).length;
    var hw_acc=(D.hw||[]).filter(function(r){return r.finalStatus==="Accepted";}).length;
    var sw_acc=(D.sw||[]).filter(function(r){return r.finalStatus==="Accepted";}).length;
    h+='<div class="cat-card" onclick="ST.tab='ns';render()"><div style="font-size:26px;font-weight:800;color:#4A90D9">'+((D.ibs||[]).length+(D.rel||[]).length).toLocaleString()+'</div><div style="font-size:10px;font-weight:700;color:#6B8199;text-transform:uppercase;margin-top:4px">New Sites</div><div style="font-size:10px;color:#6B8199;margin-top:2px">'+ns_acc+' accepted</div></div>';
    h+='<div class="cat-card" onclick="ST.tab='hw';render()"><div style="font-size:26px;font-weight:800;color:#0891b2">'+((D.hw||[]).length).toLocaleString()+'</div><div style="font-size:10px;font-weight:700;color:#6B8199;text-transform:uppercase;margin-top:4px">Expansion HW</div><div style="font-size:10px;color:#6B8199;margin-top:2px">'+hw_acc+' accepted</div></div>';
    h+='<div class="cat-card" onclick="ST.tab='sw';render()"><div style="font-size:26px;font-weight:800;color:#7c3aed">'+((D.sw||[]).length).toLocaleString()+'</div><div style="font-size:10px;font-weight:700;color:#6B8199;text-transform:uppercase;margin-top:4px">Expansion SW</div><div style="font-size:10px;color:#6B8199;margin-top:2px">'+sw_acc+' accepted</div></div>';
    h+='</div>';
    h+=buildChart(a);
  }
  else if(ST.tab==="ns"){
    h+=catSection("New Site (IBS)","&#127959;",D.ibs||[],"ns_ibs");
    h+=catSection("Relocation &amp; NXT","&#128260;",D.rel||[],"ns_rel");
  }
  else if(ST.tab==="hw"){h+=catSection("Expansion &ndash; HW","&#128225;",D.hw||[],"hw");}
  else if(ST.tab==="sw"){h+=catSection("Expansion &ndash; SW","&#128190;",D.sw||[],"sw");}
  else if(ST.tab==="lookup"){
    h+='<div class="card"><div class="card-body">';
    h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px"><span style="font-size:24px">&#128269;</span><div><div style="font-weight:700;font-size:15px">Site Lookup</div><div style="font-size:11px;color:#6B8199">Enter site IDs or upload a .txt file</div></div></div>';
    h+='<textarea id="lkTA" class="lookup-ta" rows="3" placeholder="e.g: 3120, 4896, W2260"></textarea>';
    h+='<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" style="background:#2B6CB0;color:#fff" onclick="doLookup()">&#128269; Search</button>';
    h+='<label class="btn" style="background:#0B2E59;color:#fff;cursor:pointer">&#128196; Upload .txt<input type="file" accept=".txt" onchange="uploadTxt(this)" style="display:none"></label>';
    if(ST.lookupResult)h+='<button class="btn" style="background:#00B140;color:#fff" onclick="exportCSV()">&#8595; Export CSV</button>';
    h+='</div></div></div>';
    if(ST.lookupResult){
      var nf=ST.lookupResult.filter(function(r){return r.finalStatus==="Not Found";}).length;
      h+='<div class="card"><div style="padding:10px 18px;border-bottom:1px solid #dce6f0;font-weight:700;font-size:13px">Results: '+ST.lookupResult.length+(nf?' <span style="color:#E74C3C;font-weight:400;font-size:11px">('+nf+' not found)</span>':'')+' </div>'+buildTable(ST.lookupResult,"lookup","lookup")+'</div>';
    }
  }
  h+='</div>';
  h+='<div class="footer">Mobily Site Acceptance Portal &middot; Powered by Ericsson &middot; NDO</div>';

  if(ST.drill){
    h+='<div class="modal-bg" onclick="if(event.target===this)closeDrill()"><div class="modal"><div class="modal-hdr"><h4>'+esc(ST.drill.title)+' ('+ST.drill.rows.length+')</h4><button onclick="closeDrill()">&#215;</button></div><div class="modal-body">'+buildTable(ST.drill.rows,ST.drill.type,"drill")+'</div></div></div>';
  }
  document.getElementById("app").innerHTML=h;
}

function doLookup(){
  var ta=document.getElementById("lkTA"); if(!ta)return;
  var ids=(ta.value||"").split(/[\n,;\s]+/).filter(Boolean);
  lookup(ids);
}
function lookup(ids){
  var sm=siteMap();var result=[];
  ids.forEach(function(id){var sid=id.replace(/^W/i,"").trim();var found=sm[sid];
    if(found)result=result.concat(found);
    else result.push({sid:sid,cat:"—",subcat:"—",finalStatus:"Not Found",fg4:"—",fg5:"—",itfb:"—",ao:"—",an:"Not found",aging:null,rfit:"",accDate:"",pendingReason:""});
  });
  ST.lookupResult=result;ST.tab="lookup";tablePages.lookup=0;render();
}
function uploadTxt(inp){
  var f=inp.files[0];if(!f)return;var reader=new FileReader();
  reader.onload=function(e){lookup((e.target.result||"").split(/[\n,;\r\s]+/).filter(Boolean));};
  reader.readAsText(f);
}
function exportCSV(){
  if(!ST.lookupResult)return;
  var h=["Site ID","Category","Sub-Cat","Status","4G","5G","IT Feedback","Owner","Issues","RFIT","Aging","Accepted","Reason"];
  var rows=[h.join(",")];
  ST.lookupResult.forEach(function(r){rows.push([r.sid,r.cat,r.subcat,r.finalStatus,r.fg4,r.fg5,r.itfb,r.ao,r.an,r.rfit,r.aging,r.accDate,r.pendingReason].map(function(v){return'"'+(v||"").toString().replace(/"/g,'""')+'"';}).join(","));});
  var blob=new Blob([rows.join("\n")],{type:"text/csv"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="site_lookup.csv";a.click();
}

render();
</script>
</body>
</html>
